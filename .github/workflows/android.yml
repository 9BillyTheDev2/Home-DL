name: APK de test
on:
  workflow_dispatch:
    inputs:
      package:
        description: Type de compilation
        type: choice
        default: debug
        options:
          - debug
          - signed-release
      publish:
        description: Publier la version signée pour la mise à jour intégrée
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: home-dl-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la capture du navigateur sur données synthétiques
        run: node scripts/test_browser_capture.cjs
      - name: Intégrer le moteur officiel vérifié
        run: python3 scripts/prepare_engine.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compiler le prototype
        if: inputs.package == 'debug'
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon
      - name: Vérifier l’adaptateur Instagram public sur JVM
        if: inputs.package == 'debug'
        run: gradle :app:probePublicInstagram --no-daemon
      - name: Compiler avec la signature permanente
        if: inputs.package == 'signed-release'
        env:
          HOME_DL_KEYSTORE_BASE64: ${{ secrets.HOME_DL_KEYSTORE_BASE64 }}
          HOME_DL_STORE_PASSWORD: ${{ secrets.HOME_DL_STORE_PASSWORD }}
          HOME_DL_KEY_ALIAS: ${{ secrets.HOME_DL_KEY_ALIAS }}
          HOME_DL_KEY_PASSWORD: ${{ secrets.HOME_DL_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$HOME_DL_KEYSTORE_BASE64" || -z "$HOME_DL_STORE_PASSWORD" || -z "$HOME_DL_KEY_ALIAS" || -z "$HOME_DL_KEY_PASSWORD" ]]; then
            echo "::error::Signature permanente non configurée. Utilisez debug ou configurez les quatre secrets HOME_DL."
            exit 1
          fi
          export HOME_DL_KEYSTORE="$RUNNER_TEMP/home-dl-signing.jks"
          trap 'rm -f "$HOME_DL_KEYSTORE"' EXIT
          printf '%s' "$HOME_DL_KEYSTORE_BASE64" | base64 --decode > "$HOME_DL_KEYSTORE"
          gradle :app:testDebugUnitTest :app:assembleRelease :app:lintRelease --no-daemon
          python3 scripts/make_update_manifest.py
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify release/Home-DL.apk
      - uses: actions/upload-artifact@v4
        if: inputs.package == 'debug'
        with:
          name: Home-DL-prototype-arm64
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.package == 'signed-release'
        with:
          name: Home-DL-release
          path: release/
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: build
    if: inputs.package == 'signed-release' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Home-DL-release
          path: release
      - name: Publier la mise à jour signée
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("release/update.json"))["versionName"])')
          gh release create "v$version" release/Home-DL.apk release/update.json --target "$SOURCE_COMMIT" --title "Home-DL $version" --notes "Mise à jour Home-DL signée. Installation avec confirmation Android." --latest
